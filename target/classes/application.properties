server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/smart_building?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=manager
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.type=org.springframework.jdbc.datasource.SimpleDriverDataSource

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT settings (read by JwtUtil with @Value) ---
# Secret used to SIGN tokens. Must be long (at least 32 characters).
# Anyone with this secret can create valid tokens, so keep it private.
jwt.secret=SmartConnectSecretKey12345!@#$%LongerKeyForSecurity
# Access token lifetime in milliseconds: 86400000 = 24 hours.
jwt.expiration=86400000
# Refresh token lifetime in milliseconds: 604800000 = 7 days.
jwt.refresh-expiration=604800000

logging.level.com.smartbuilding=DEBUG